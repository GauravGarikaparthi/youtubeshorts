name: Generate Long-Form AI Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic / thesis"
        required: true
        default: "The future of artificial intelligence in healthcare"
        type: string
      llm_provider:
        description: "LLM provider for script generation"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - claude
          - groq
      image_gen_provider:
        description: "Image generation provider"
        required: false
        default: "replicate_flux"
        type: choice
        options:
          - replicate_flux
          - together_flux
      video_gen_provider:
        description: "Video generation / animation provider"
        required: false
        default: "replicate"
        type: choice
        options:
          - replicate
          - together
          - huggingface
      tts_provider:
        description: "Text-to-speech provider"
        required: false
        default: "kokoro"
        type: choice
        options:
          - kokoro
          - piper
          - elevenlabs
          - edge_tts
      kokoro_voice:
        description: "Kokoro voice ID (en-us: am_adam, bf_emma, etc.)"
        required: false
        default: "am_adam"
        type: string
      piper_voice:
        description: "Piper voice model name (e.g. en_US-amy-low)"
        required: false
        default: "en_US-amy-low"
        type: string
      target_duration_seconds:
        description: "Target total video length (seconds)"
        required: false
        default: "180"
        type: string
      resolution:
        description: "Target resolution e.g. 1920x1080"
        required: false
        default: "1920x1080"
        type: string
    schedule:
      - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'gemini' }}
      IMAGE_GEN_PROVIDER: ${{ github.event.inputs.image_gen_provider || 'replicate_flux' }}
      VIDEO_GEN_PROVIDER: ${{ github.event.inputs.video_gen_provider || 'replicate' }}
      TTS_PROVIDER: ${{ github.event.inputs.tts_provider || 'kokoro' }}
      KOKORO_VOICE: ${{ github.event.inputs.kokoro_voice || 'am_adam' }}
      PIPER_VOICE: ${{ github.event.inputs.piper_voice || 'en_US-amy-low' }}
      TARGET_DURATION_SECONDS: ${{ github.event.inputs.target_duration_seconds || '180' }}
      RESOLUTION: ${{ github.event.inputs.resolution || '1920x1080' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache Kokoro TTS model weights
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Download Kokoro TTS model files (skip if cached)
        run: |
          mkdir -p models
          if [ ! -f models/kokoro-v1.0.onnx ]; then
            echo "Downloading Kokoro model weights..."
            curl -sL -o models/kokoro-v1.0.onnx \
              https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
            curl -sL -o models/voices-v1.0.bin \
              https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          fi

      - name: Cache Piper voice models
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voices-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Download Piper voice model (if piper TTS selected and not cached)
        if: ${{ env.TTS_PROVIDER == 'piper' }}
        run: |
          mkdir -p voices
          if [ ! -f voices/${{ env.PIPER_VOICE }}.onnx ]; then
            echo "Downloading Piper voice '${{ env.PIPER_VOICE }}'..."
            python -m piper.download_voices ${{ env.PIPER_VOICE }} --data-dir voices
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI video pipeline
        id: pipeline
        env:
          TOPIC: ${{ github.event.inputs.topic || 'The future of artificial intelligence in healthcare' }}
        run: |
          python orchestrator.py

      - name: Evaluate prior videos and feed optimization engine
        if: always()
        run: |
          python src/evaluate_pending.py || true

      - name: Upload final video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform-video-output
          path: |
            output/final_video.mp4
            output/metadata.json
            output/thumbnail.png
            work/
            work/virality_history.json
            work/optimization_state.json
            work/longform_uploads.json
            work/shorts_uploads.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: work/*.log
          retention-days: 7
          if-no-files-found: ignore
