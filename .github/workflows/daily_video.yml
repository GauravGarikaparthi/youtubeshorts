name: Daily YouTube Shorts (6x/day)

on:
  schedule:
    # 6 Shorts per day: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      topic_mode:
        description: "How to pick today's topic"
        type: choice
        default: category
        options:
          - category
          - custom
      category:
        description: "Category to pick from. 'finance' researches the live web first and is the default."
        type: choice
        default: finance
        options:
          - finance
          - any
          - facts
          - science
          - history
          - motivation
          - animals
          - personality
          - sports
          - documentary
          - islamic
          - music
          - horror
          - cartoons
      custom_topic:
        description: "Exact topic to use (used only if topic_mode = custom)"
        type: string
        default: ""
      video_mode:
        description: "Upload as a regular video or a YouTube Short"
        type: choice
        default: shorts
        options:
          - shorts
          - video
      language:
        description: "Script + voiceover language (Piper has no Urdu voice yet)"
        type: choice
        default: english
        options:
          - english
          - spanish
          - french
          - german
          - arabic
          - hindi
          - portuguese
          - russian
          - turkish
          - chinese
      yt_privacy_status:
        description: "YouTube upload privacy"
        type: choice
        default: public
        options:
          - public
          - private
          - unlisted

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + espeak-ng
        timeout-minutes: 3
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg espeak-ng

      - name: Download Montserrat Bold font (clean bold sans-serif for captions/titles)
        run: |
          mkdir -p fonts
          curl -sL -o fonts/Montserrat-Bold.ttf \
            https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Bold.ttf

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Kokoro TTS model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-model-v1

      - name: Download Kokoro TTS model files (skip if cached)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sL -o models/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sL -o models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Evaluate pending Shorts analytics (recursive learning engine)
        # Before generating a new Short, pull analytics for previously-uploaded
        # videos whose data is now available (24-48h after upload) so the next
        # run can learn from what actually performed.
        if: always()
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/evaluate_pending.py || true

      - name: Run daily shorts pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOPIC_MODE: ${{ github.event.inputs.topic_mode || 'category' }}
          TOPIC_CATEGORY: ${{ github.event.inputs.category || 'finance' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'shorts' }}
          LANGUAGE: ${{ github.event.inputs.language || 'english' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ github.event.inputs.yt_privacy_status || 'public' }}
        run: python main.py

      - name: Upload final video + metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-${{ github.run_id }}
          path: |
            output/video.mp4
            output/thumbnail.jpg
            work/finance_history.json
            work/shorts_uploads.json
            work/virality_history.json
            work/optimization_state.json
          retention-days: 14
          if-no-files-found: warn

      - name: Run virality report
        if: always()
        run: |
          python3 -c "import sys; sys.path.insert(0, 'src'); from optimization_engine import get_engine; import json; engine = get_engine(); print(json.dumps(engine.get_performance_summary(), indent=2))" 2>/dev/null || echo "No optimization data yet."
