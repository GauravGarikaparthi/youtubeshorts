name: Daily Long-Form Regular Video (1x/day via Google Flow)

on:
  schedule:
    # 1 regular video per day at 22:00 UTC — uses Google Flow, all 50 free credits
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      topic_mode:
        description: "How to pick today's topic"
        type: choice
        default: category
        options:
          - trending
          - category
          - custom
      category:
        description: "Category to pick from"
        type: choice
        default: any
        options:
          - any
          - facts
          - science
          - history
          - motivation
          - finance
          - animals
          - personality
          - sports
          - documentary
          - islamic
          - music
          - horror
          - cartoons
      custom_topic:
        description: "Exact topic to use (used only if topic_mode = custom)"
        type: string
        default: ""

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + espeak-ng
        timeout-minutes: 3
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg espeak-ng

      - name: Download Montserrat Bold font
        run: |
          mkdir -p fonts
          curl -sL -o fonts/Montserrat-Bold.ttf \
            https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Bold.ttf

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Kokoro TTS model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-model-v1

      - name: Download Kokoro TTS model files (skip if cached)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sL -o models/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sL -o models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Evaluate pending videos (Shorts + Long-form)
        # Before generating a new video, evaluate any previously-uploaded
        # videos whose analytics are now available (24-48h after upload).
        # This feeds data into the recursive learning engine for BOTH shorts
        # and long-form videos.
        if: always()
        run: |
          python src/longform_video_pipeline.py --evaluate-pending || true
          python src/evaluate_pending.py || true

      - name: Run daily long-form pipeline (Google Flow, 50 free credits)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ github.event.inputs.yt_privacy_status || 'public' }}
          GOOGLE_FLOW_PROJECT_ID: ${{ secrets.GOOGLE_FLOW_PROJECT_ID }}
          GOOGLE_FLOW_API_KEY: ${{ secrets.GOOGLE_FLOW_API_KEY }}
          TOPIC_MODE: ${{ github.event.inputs.topic_mode || 'category' }}
          TOPIC_CATEGORY: ${{ github.event.inputs.category || 'any' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
        run: python src/longform_video_pipeline.py

      - name: Upload long-form video + metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-longform-${{ github.run_id }}
          path: |
            output/longform/
            work/longform/
            work/virality_history.json
            work/optimization_state.json
            work/longform_uploads.json
            work/shorts_uploads.json
          retention-days: 14
          if-no-files-found: warn

      - name: Run virality report
        if: always()
        run: |
          echo "=== Virality Optimization Report ==="
          python3 -c "import sys; sys.path.insert(0, 'src'); from optimization_engine import get_engine; import json; engine = get_engine(); print(json.dumps(engine.get_performance_summary(), indent=2))" 2>/dev/null || echo "No optimization data yet."
